[project]
name = "cookish-backend"
version = "0.1.0"
description = "Cookish API: inventory, Cook and Shop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "mangum>=0.19",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6,<7",
    "pytest>=8",
    "pyyaml>=6,<7",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
