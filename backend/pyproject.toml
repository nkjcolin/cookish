[project]
name = "cookish-backend"
version = "0.1.0"
description = "Cookish API: inventory, Cook and Shop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
