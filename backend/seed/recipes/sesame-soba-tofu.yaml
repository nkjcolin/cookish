steps:
- Bring a large saucepan of water to a boil. Meanwhile, prepare the cucumber, carrot and tofu, and mix
  the sesame oil and soy sauce in a large serving bowl.
- Gently simmer the tofu cubes in the water for 5 minutes or until heated through according to the packet,
  then lift them into a colander with a slotted spoon.
- Return the water to a boil and add the soba. Cook for the time on the noodle packet, stirring gently
  to separate the strands.
- Drain the noodles, rinse under cold running water to remove surface starch, and drain well.
- Toss the noodles, cucumber and carrot in the dressing, fold in the warm drained tofu, and serve immediately.
  Refrigerate any portion being kept for later promptly.
