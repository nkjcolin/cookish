steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Spread the firm tofu in a shallow heatproof dish. Beat the eggs, measure their volume, and mix in one
  and a half times that volume of room-temperature water. Pour over the tofu, leaving room at the top.
- Bring the steamer water to a simmer below the rack. Cover the dish loosely with a heatproof plate and
  steam with the lid on for about 20 to 25 minutes. Keep water in the steamer throughout.
- Continue steaming until the egg is fully set at the centre and the tofu is hot throughout. Lift out
  carefully, spoon the soy sauce over, scatter the spring onion and serve with the rice.
