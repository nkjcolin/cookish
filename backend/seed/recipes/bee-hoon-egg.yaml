steps:
- Prepare and drain the rice vermicelli according to the packet. Warm one third of the oil in a large
  nonstick pan, scramble the eggs until fully set, and transfer them to a clean plate.
- Add the remaining oil and garlic, then stir in the cabbage and carrot. Cook for 3 to 4 minutes until
  starting to soften.
- Pour in the measured braising water and soy sauce. Add the noodles and turn them through the vegetables,
  simmering for about 4 to 6 minutes until tender and the liquid is mostly absorbed.
- Fold the scrambled eggs through the noodles and heat everything until hot throughout. If the noodles
  need more cooking, add a little drinking water and continue before serving.
