steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Set up the steamer with water according to its instructions. Put the fish on a heatproof plate and scatter
  ginger over it; add soy sauce and black pepper if using.
- When the steamer is producing steady steam, cover and cook the fish. Allow roughly 10 to 15 minutes,
  adjusting for thickness, and continue until a clean thermometer in the thickest part reads at least
  75 C for 2 minutes.
- Steam the broccoli until tender, using a separate tray or steaming it after the fish if space is limited.
  Keep the cooked components hot.
- Check for any remaining bones, add spring onion if using and serve with the rice and broccoli immediately.
