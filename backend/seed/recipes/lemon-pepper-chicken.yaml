steps:
- Cut the potatoes and carrots, cover them with water in a saucepan, and bring to a boil. Simmer for 12-15
  minutes until the potato is tender, then drain and keep covered.
- Meanwhile, prepare the lemon. Cut the chicken on a separate board; wash hands and utensils afterwards.
  Season the chicken with half the salt and half the pepper.
- Heat two-thirds of the oil in a lidded non-stick frying pan over medium heat. Cook the chicken for 4
  minutes, turn, and cook for 4 minutes more.
- Add a splash of water and cover. Continue cooking for about 4-6 minutes, turning if needed. Verify the
  thickest chicken reaches 75 C for 2 minutes; extend cooking as necessary.
- Toss the drained potatoes and carrots with the remaining oil, salt and pepper. Stir the lemon zest and
  juice into the cooked chicken pan, then serve the chicken and pan juices beside the vegetables immediately.
