steps:
- Rinse and drain the rice. Add to a large saucepan with the ginger and cooking water, using a little
  more than a litre of water per 100 g dry rice as a starting point. Bring to a boil.
- Lower to a gentle simmer, leave the lid partly open, and cook for 35-40 minutes, stirring regularly
  along the base. Add more water if needed as the grains soften and split.
- Meanwhile, prepare the mushrooms, tofu and spring onion if using. Add the mushrooms and tofu once the
  rice is very soft.
- Simmer for 10-12 minutes, stirring gently, until the mushrooms are tender and the tofu is hot through.
  Stir in the soy sauce and spring onion if using.
- Check the porridge is loose enough to spoon, adding water and bringing back to a simmer if needed. Divide
  into bowls and serve promptly.
