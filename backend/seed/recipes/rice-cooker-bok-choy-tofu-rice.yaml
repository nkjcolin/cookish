steps:
- Use a rice cooker whose instructions allow mixed rice with vegetables and tofu. Put the rinsed rice
  in the inner pot and add the water and soy sauce as the cooking liquid; keep within the mixed-rice capacity
  stated by the manufacturer.
- Distribute the ginger, garlic if using, tofu and bok choy over the rice. Keep the rice level below and
  do not pack the vegetables tightly against the lid or steam vent.
- Start the appropriate white-rice or mixed-rice cycle and let it finish. The cycle is commonly around
  30 to 40 minutes, but use your cooker instructions and allow longer when needed.
- Open carefully after the cycle ends. Check that the rice is tender, the stems are cooked and the tofu
  is hot throughout; if not, continue with the manufacturer-approved cooking mode. Rest covered for 5
  minutes, then gently mix and serve.
