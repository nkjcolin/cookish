steps:
- Heat one third of the oil in a large nonstick pan. Scramble the eggs until fully set and transfer them
  to a clean plate.
- Add another third of the oil and the chicken. Stir-fry until cooked, using a clean thermometer to check
  several thick pieces reach at least 75 C for 2 minutes. Transfer to a second clean plate, keeping raw-chicken
  utensils separate.
- Add the remaining oil, garlic if using, carrot and peas. Cook until the vegetables are tender, then
  add the loosened rice and stir-fry for about 5 minutes.
- Return the cooked chicken and egg, add soy sauce and spring onion if using, and turn everything through
  the rice. Stir and check several parts with a clean food thermometer; keep the rice at 75 C or hotter
  for at least 2 minutes. Continue heating if necessary and serve immediately. Reheating cannot make poorly
  stored rice safe.
