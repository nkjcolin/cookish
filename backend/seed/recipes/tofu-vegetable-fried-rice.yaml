steps:
- Break up the rice clumps. Heat two thirds of the oil in a nonstick pan and cook the tofu for 5 to 6
  minutes, turning it gently, until some surfaces are lightly golden.
- Move the tofu to a clean plate. Add the rest of the oil, carrot and garlic if using, then stir-fry for
  about 3 minutes. Add the peas and cook until the vegetables are tender.
- Add the rice and stir-fry for about 5 minutes. Return the tofu and add soy sauce and spring onion if
  using, folding carefully so the tofu holds its shape.
- Stir and check several parts with a clean food thermometer; keep the rice at 75 C or hotter for at least
  2 minutes. Continue heating if necessary and serve immediately. Reheating cannot make poorly stored
  rice safe.
