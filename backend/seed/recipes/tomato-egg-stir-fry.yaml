title: Tomato and egg stir-fry
variant_of: null
cuisine: chinese
total_minutes: 20
active_minutes: 15
difficulty: 1
servings: 2
equipment: [stove]
taste_tags: [light]
ingredients:
  - {canonical_name: tomato, quantity: 300, unit: g, essential: true, prep_note: cut into wedges}
  - {canonical_name: egg, quantity: 3, unit: pcs, essential: true, prep_note: beaten}
  - {canonical_name: canola oil, quantity: 15, unit: ml, essential: true}
  - {canonical_name: salt, quantity: 1, unit: g, essential: false}
  - {canonical_name: water, quantity: 30, unit: ml, essential: true}
  - {canonical_name: spring onion, quantity: 10, unit: g, essential: false, prep_note: thinly sliced}
steps:
  - Heat two thirds of the oil in a nonstick frying pan over medium heat. Add the beaten eggs and stir until fully set, then transfer to a plate.
  - Add the remaining oil and the tomato to the pan. Stir-fry for 2 minutes, then add the water and cover.
  - Cook for 4 to 6 minutes until the tomato is soft and releases its juices.
  - Return the eggs to the pan, add the salt if using, and fold together until everything is hot. Finish with the spring onion if using.
