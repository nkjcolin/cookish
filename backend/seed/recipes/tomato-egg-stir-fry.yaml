steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Warm two thirds of the oil in a nonstick pan. Stir the beaten eggs over medium heat until set, then
  transfer them to a clean bowl.
- Use the remaining oil to soften the tomatoes for a few minutes. Add a splash of water, cover and cook
  until the wedges release a sauce.
- Fold the eggs into the tomatoes. Add the salt if using and heat until the eggs are completely cooked
  and the topping is hot throughout.
- Divide the cooked rice between bowls, spoon over the topping and add the spring onion if using. Serve
  immediately.
