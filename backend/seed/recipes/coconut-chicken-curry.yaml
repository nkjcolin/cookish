steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in a saucepan. Cook the onion for 4 minutes, then stir in the garlic, ginger, turmeric
  and chilli paste for 1 minute.
- Add the chicken thigh pieces and turn for 3 minutes. Add the coconut milk, carrot, long bean, salt and
  enough water to make a loose sauce.
- 'Simmer gently, partly covered, for about 15 to 20 minutes until the vegetables are tender. Check the
  thickest chicken pieces with a food thermometer: they must reach at least 75 C and remain there for
  2 minutes. Continue simmering if needed, then serve with the rice.'
