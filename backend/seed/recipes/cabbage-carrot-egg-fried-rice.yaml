steps:
- Break the rice into loose grains. Heat one third of the oil in a large nonstick pan and scramble the
  eggs until fully set. Transfer the eggs to a clean plate.
- Add the remaining oil, garlic if using, carrot and cabbage. Stir-fry for about 5 minutes, then add the
  peas and cook until the vegetables are tender and the peas are hot.
- Add the rice and keep turning it through the vegetables for about 5 minutes. Work in batches if needed
  so the rice heats evenly.
- Return the egg, add soy sauce and spring onion if using, and toss together. Stir and check several parts
  with a clean food thermometer; keep the rice at 75 C or hotter for at least 2 minutes. Continue heating
  if necessary and serve immediately. Reheating cannot make poorly stored rice safe.
