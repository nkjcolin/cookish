steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat half the canola oil in a non-stick frying pan over medium heat. Add the firm tofu and turn gently
  for 6 to 8 minutes until lightly golden; transfer to a clean plate.
- Add the remaining oil, garlic and ginger to the pan. Stir briefly, then add the broccoli and enough
  water to cover the base of the pan. Cover and cook for 4 to 6 minutes until the stems are tender.
- Return the tofu and add the soy sauce. Toss gently and cook uncovered for 2 minutes until everything
  is hot; add a splash of water if the pan becomes dry. Serve over the cooked rice.
