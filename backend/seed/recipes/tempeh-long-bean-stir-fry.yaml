steps:
- Rinse the rice, drain, and place in a saucepan with the water amount directed on its packet. Bring to
  a boil, cover, and cook on low heat for the packet's time, then rest covered off the heat while finishing
  the stir-fry.
- While the rice cooks, wash and cut the beans, cube the tempeh, and chop the garlic.
- Heat the oil in a lidded frying pan over medium heat. Cook the tempeh for 6-8 minutes, turning to colour
  several sides.
- Add the garlic and beans. Stir for a minute, then add a splash of water, cover, and cook for 8-10 minutes,
  stirring occasionally and adding a little more water if dry, until the beans are tender.
- Stir in the soy sauce and cook uncovered for 1-2 minutes to coat the tempeh. Check the tempeh is cooked
  through according to its packet, fluff the rice, and serve together immediately.
