steps:
  - Heat the oil in a nonstick frying pan over medium heat. Add the tofu and cook for 6 to 8 minutes, turning gently until lightly golden.
  - Add the garlic if using and stir for 30 seconds.
  - Add the cabbage and water. Cover for 3 minutes, then uncover and stir until the cabbage is tender and the tofu is hot throughout.
  - Add the soy sauce if using and toss gently for 1 minute before serving.
