steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Dry the tofu surfaces with a clean kitchen towel. Warm two thirds of the oil in a nonstick pan and turn
  the tofu gently until lightly coloured.
- Add the remaining oil and garlic if using, followed by the cabbage. Stir until the leaves begin to wilt.
- Add a splash of water and cover briefly until the cabbage is tender and the tofu is hot throughout.
  Add the soy sauce if using.
- Divide the rice and topping between bowls. Serve immediately while hot.
