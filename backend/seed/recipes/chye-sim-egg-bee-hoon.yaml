steps:
- Start heating the broth water in a saucepan while preparing the rice vermicelli according to its packet
  in a separate bowl or pan. Drain the noodles when ready.
- Bring the broth water to a boil. Add the chye sim stems and simmer for about 3 minutes. Add the leaves,
  salt and pepper if using and cook for another 2 minutes until the stems are tender.
- Keep the soup at a gentle simmer and pour in the egg in a thin stream, stirring slowly to form ribbons.
  Continue simmering until all the egg is fully set.
- Add the prepared noodles, bring back to a simmer and serve the noodles, greens, egg and broth together
  while hot.
