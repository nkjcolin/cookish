steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in a saucepan. Cook the onion over medium heat for 5 minutes, then add the garlic,
  turmeric and cumin and stir for 30 seconds.
- Add the tomato and salt. Cook for 6 to 8 minutes, stirring, until the tomatoes break down. Add the canned
  chickpeas and enough water to make a loose sauce.
- Simmer for 10 to 12 minutes until the chickpeas are hot and soft, stirring occasionally. Crush a few
  chickpeas with the spoon to thicken the sauce and serve with the rice.
