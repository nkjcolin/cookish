title: One-pot ginger chicken rice
variant_of: null
cuisine: chinese
total_minutes: 45
active_minutes: 20
difficulty: 2
servings: 2
equipment: [stove]
taste_tags: [light]
ingredients:
  - {canonical_name: chicken thigh, quantity: 300, unit: g, essential: true, prep_note: boneless and cut into small bite-size pieces}
  - {canonical_name: uncooked rice, quantity: 200, unit: g, essential: true}
  - {canonical_name: ginger, quantity: 20, unit: g, essential: true, prep_note: peeled and finely sliced}
  - {canonical_name: garlic, quantity: 8, unit: g, essential: false, prep_note: finely chopped}
  - {canonical_name: canola oil, quantity: 10, unit: ml, essential: true}
  - {canonical_name: soy sauce, quantity: 15, unit: ml, essential: false}
  - {canonical_name: water, quantity: 400, unit: ml, essential: true}
  - {canonical_name: spring onion, quantity: 10, unit: g, essential: false, prep_note: thinly sliced}
steps:
  - Heat the oil in a heavy saucepan over medium heat. Add the ginger and garlic if using, and stir for 1 minute.
  - Add the chicken and stir for 5 minutes, turning the pieces to cook the surfaces evenly.
  - Stir in the uncooked rice, water, and soy sauce if using. Bring to a gentle boil.
  - Cover, turn the heat to low, and simmer for about 20 minutes until the rice is tender and the chicken is fully cooked throughout. Continue cooking if needed; do not serve partially cooked chicken.
  - Turn off the heat and leave covered for 5 minutes. Fluff the rice gently and add the spring onion if using.
