steps:
- Rinse and drain the rice. Prepare vegetables on a clean board; use separate utensils and a board for
  the raw chicken.
- Warm the oil in a lidded saucepan. Stir in ginger and garlic if using, then add chicken and turn it
  until the surfaces change colour.
- Add the rice, measured water, bok choy stems and soy sauce if using. Bring to a boil, cover and cook
  gently for about 20 minutes; check the rice packet and add a little water if necessary.
- Place the bok choy leaves on top and cover again until wilted and the rice is tender. Confirm the thickest
  chicken pieces reach at least 75 C for 2 minutes with a food thermometer; continue cooking if needed.
- Leave covered off the heat for 5 minutes, then gently mix. Add spring onion if using and serve immediately.
