steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Heat half the oil in a pan and turn the tofu until lightly coloured and hot throughout. Set it aside
  in a clean bowl.
- Add the remaining oil, garlic and water-spinach stems. Stir briefly, then add the leaves and a splash
  of water.
- Cover for a few minutes, then stir until the stems are tender and the leaves are fully cooked.
- Return the tofu, add soy sauce if using and heat everything together. Serve over the cooked rice.
