steps:
- Prepare the rice vermicelli according to its packet and drain. Keep the noodle utensils separate from
  those used for the raw chicken.
- Bring the measured soup water, ginger and soy sauce to a boil. Add the chicken, return to a simmer and
  cook for about 8 to 10 minutes.
- Use a clean thermometer to check several thick chicken pieces reach at least 75 C for 2 minutes; continue
  simmering as needed. Add the bok choy stems and cook for 3 minutes, followed by the leaves for another
  2 minutes.
- Add the drained noodles, bring the soup back to a simmer and check that everything is hot. Share the
  chicken, noodles, vegetables and broth evenly between bowls.
