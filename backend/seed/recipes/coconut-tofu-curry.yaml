steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in a saucepan and cook the onion for 4 minutes. Stir in the garlic, ginger, turmeric
  and chilli paste and cook for a further minute.
- Add the carrot and long bean, plus enough water to cover the base of the pan. Cover and simmer for 6
  to 8 minutes, until the vegetables are nearly tender.
- Stir in the coconut milk, firm tofu and salt. Add water if needed to make a loose sauce and simmer gently
  for 6 to 8 minutes until the tofu is hot throughout and the vegetables are tender. Serve with the rice.
