steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in a wide saucepan. Cook the onion for 5 minutes, then stir in the garlic, turmeric
  and cumin. Add the tomato and cook for 4 minutes until softened.
- Add the potato, salt and enough water to reach halfway up the potato pieces. Cover and simmer for 8
  minutes, stirring once.
- Add the cauliflower, cover again and simmer for 10 to 15 minutes until the potato yields easily to a
  fork and cauliflower is tender. Add a little water if it dries out; uncover briefly if too wet. Serve
  with the rice.
