steps:
- Break up the cooked rice clumps before starting. Heat two thirds of the oil in a large nonstick frying
  pan, scramble the eggs until fully set, then transfer them to a clean plate.
- Put the remaining oil and tomatoes in the pan. Stir for 2 minutes, add half the water, cover and cook
  for about 3 minutes until the tomatoes soften.
- Add the cooked rice, remaining water and salt if using. Fold through the tomatoes, cover and heat for
  about 4 to 6 minutes, stirring to warm the rice evenly.
- Return the eggs and spring onion if using and stir gently until combined. Stir and check several parts
  with a clean food thermometer; keep the rice at 75 C or hotter for at least 2 minutes. Continue heating
  if necessary and serve immediately. Reheating cannot make poorly stored rice safe.
