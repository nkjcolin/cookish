steps:
- Prepare the rice vermicelli in water according to its packet, then drain and divide between serving
  bowls.
- Put the tomato and ginger in a saucepan with enough water for a soup broth. Bring to a boil and simmer
  for 8 to 10 minutes until the tomato softens.
- Add the cod and simmer gently for about 6 to 10 minutes. Check the thickest pieces with a food thermometer;
  continue cooking until at least 75 C is maintained for 2 minutes and the fish is opaque throughout.
- Stir in the salt and spring onion. Divide the fish and hot soup over the vermicelli and serve immediately.
