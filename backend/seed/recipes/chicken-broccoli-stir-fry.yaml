steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in a non-stick pan over medium-high heat. Add the chicken thigh pieces in one layer;
  turn and cook for about 6 minutes. Lower the heat and stir in the garlic and ginger for 30 seconds.
- Add the broccoli, soy sauce and enough water to cover the base of the pan. Cover and simmer for 5 to
  8 minutes, stirring occasionally, until the broccoli is tender and the chicken is cooked.
- 'Check the thickest chicken pieces with a food thermometer: they must reach at least 75 C and stay at
  that temperature for 2 minutes. Continue cooking if needed. Serve with the rice.'
