steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Beat the eggs with the salt and spring onion. Heat half the canola oil in a non-stick pan and cook the
  fresh shiitake mushrooms for 5 to 7 minutes until tender and their liquid has evaporated.
- Spread the mushrooms evenly, add the remaining oil, then pour over the egg mixture. Cook over medium-low
  heat, gently lifting the set edges to let uncooked egg reach the pan.
- Cover and cook for about 4 to 6 minutes until the centre is fully set with no runny egg; lower the heat
  if the underside browns too quickly. Divide the omelette and serve with the rice.
