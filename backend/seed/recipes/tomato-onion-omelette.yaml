steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat half the canola oil in a non-stick pan. Cook the onion over medium heat for 4 minutes, add the
  tomato and cook for a further 5 minutes until the mixture is soft and excess liquid has evaporated.
- Beat the eggs with the salt. Spread the vegetables evenly, add the remaining oil and pour in the eggs.
  Cook over medium-low heat, lifting the set edges to let uncooked egg reach the pan.
- Cover for about 4 to 6 minutes until the centre has set fully without any runny egg. Divide and serve
  with the rice.
