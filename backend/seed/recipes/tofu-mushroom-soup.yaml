steps:
- Prepare the rice vermicelli as directed on its packet, then drain. Keep it separate while the broth
  cooks.
- Bring the measured broth water to a boil with the ginger and mushrooms. Simmer until the mushrooms are
  tender.
- Add cabbage and tofu. Bring the soup back to a boil, then simmer until the cabbage is soft and the tofu
  is hot throughout.
- Add the prepared noodles and soy sauce if using. Heat together, divide between bowls and add spring
  onion if using.
