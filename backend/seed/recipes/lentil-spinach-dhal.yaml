steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Heat the canola oil in another saucepan. Cook the onion over medium-low heat for 5 minutes. Stir in
  the garlic if using, turmeric and cumin, then add the tomato and cook for 3 minutes.
- Add the red lentils and enough water to cover them generously. Simmer partly covered for 20 to 25 minutes,
  stirring and adding water as needed, until the lentils are soft and no hard centres remain.
- Stir in the spinach and simmer for another 3 to 5 minutes until wilted and tender. Stir in the salt
  if using, then serve the dhal with the rice.
