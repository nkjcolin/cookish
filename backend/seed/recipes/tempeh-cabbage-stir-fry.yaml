steps:
- Rinse the rice, drain, and put in a saucepan with water according to its packet. Bring to a boil, cover,
  and cook over low heat for the packet's time, then rest covered off the heat.
- Meanwhile, prepare the cabbage, tempeh and garlic. Heat the oil in a lidded frying pan over medium heat
  and cook the tempeh for 6-8 minutes, turning occasionally.
- Stir in the garlic, then add the cabbage. Add a splash of water, cover, and cook for 5-7 minutes, stirring
  partway through, until the cabbage stems are tender.
- Add the soy sauce. Cook uncovered for another 1-2 minutes until the liquid lightly coats the ingredients
  and the tempeh is cooked through according to its packet. Fluff the rice and serve with the stir-fry
  immediately.
