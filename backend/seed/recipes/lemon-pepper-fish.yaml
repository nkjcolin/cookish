steps:
- Prepare the potatoes and carrots. Place them in a saucepan, cover with water, bring to a boil, and simmer
  for 12-15 minutes until a fork enters the potato easily. Drain and keep covered.
- While the vegetables cook, zest and juice the lemon. Pat the cod dry, check for bones, and season with
  half the salt and half the black pepper.
- Heat two-thirds of the oil in a non-stick frying pan over medium heat. Place the fillets in the pan
  and cook for about 4-5 minutes per side, turning carefully. Verify the centre reaches 75 C for 2 minutes;
  allow longer for thicker pieces.
- Toss the drained vegetables with the remaining oil, salt and pepper, then add the lemon zest. Divide
  between plates with the fish and spoon the lemon juice over just before serving.
