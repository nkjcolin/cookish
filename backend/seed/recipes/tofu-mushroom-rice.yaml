steps:
- Warm the oil in a heavy saucepan. Cook the ginger and garlic if using for about 1 minute, then add the
  mushrooms and stir for 2 minutes.
- Stir in the rice, water and soy sauce. Place the tofu evenly over the top and bring the liquid to a
  steady simmer.
- Cover and cook over low heat for about 20 minutes until the rice is tender and the tofu is hot throughout.
  If the pan becomes dry while the rice is still firm, add a little drinking water and continue cooking.
- Take the pan off the heat and leave covered for 5 minutes. Fold the tofu and mushrooms gently through
  the rice and scatter over the spring onion if using.
