steps:
- Start with freshly cooked rice for immediate assembly, or cold cooked rice that was chilled promptly
  and kept below 4 C. The 15-minute time assumes cooked rice is already available; do not leave hot rice
  out to cool for this salad.
- Wash and dice the cucumber and tomato. Drain the canned chickpeas and check that the label permits eating
  them without further cooking.
- Squeeze the lemon juice into a large bowl and mix with the oil, salt and pepper.
- Add the rice, chickpeas, cucumber and tomato. Fold together so the dressing is evenly distributed, then
  divide between bowls and eat immediately. If serving later, refrigerate promptly below 4 C.
