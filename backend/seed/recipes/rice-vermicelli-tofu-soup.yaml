steps:
- Soak or cook the rice vermicelli according to the packet instructions, then drain. Prepare the vegetables
  while the noodles soften.
- Bring the measured soup water, ginger and soy sauce to a boil in a saucepan. Add the bok choy stems
  and simmer for 3 minutes.
- Add the tofu and bok choy leaves. Simmer gently for another 4 to 5 minutes, until the tofu is hot throughout
  and the stems are tender.
- Add the prepared noodles and heat the soup back to a simmer. Divide the noodles, tofu, vegetables and
  broth evenly between bowls and serve hot.
