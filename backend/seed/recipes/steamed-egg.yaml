  essential: true
steps:
- 'Start the rice first: rinse the uncooked rice, then cook it in water in a covered saucepan following
  its packet instructions. Prepare the rest of the meal while it cooks; keep the rice covered until serving.'
- Beat the eggs in a measuring jug and note their volume. Gently mix in one and a half times that volume
  of room-temperature water. Pour into a shallow heatproof dish, leaving room at the top.
- Add water to the steamer below its rack and bring to a simmer. Cover the egg dish loosely with a heatproof
  plate, place it on the rack and steam with the lid on for about 15 to 20 minutes.
- Check that the custard is set through the centre with no liquid egg; continue steaming if necessary,
  topping up the steamer with hot water before it runs dry. Lift out carefully, add soy sauce and spring
  onion, and serve with the rice.
