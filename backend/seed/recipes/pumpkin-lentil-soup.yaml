steps:
- Prepare the vegetables and rinse the lentils. Heat the oil in a large saucepan over medium heat and
  soften the onion for 4 minutes.
- Add the garlic and cumin and stir for 30 seconds. Add the pumpkin, potato, lentils and measured water,
  then bring to a boil.
- Lower to a gentle simmer, partially cover, and cook for 25-30 minutes, stirring along the base regularly,
  until the lentils have collapsed and the pumpkin and potato are easily crushed.
- If it thickens too quickly, cover fully and lower the heat. Mash some of the pumpkin and potato against
  the side of the pot with a spoon to thicken the soup without a blender.
- Stir in the salt, check everything is tender, and divide the hot soup between bowls. The potatoes and
  lentils are part of the meal; no unlisted bread or side is required.
