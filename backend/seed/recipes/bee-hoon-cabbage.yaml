steps:
- Prepare the rice vermicelli according to the packet until pliable, then drain well. Keep the measured
  braising water separate.
- Warm the oil in a large frying pan and cook the garlic briefly without browning it. Add the cabbage
  and carrot and stir for 3 to 4 minutes.
- Pour in the braising water and soy sauce and bring to a simmer. Add the noodles and lift and turn them
  through the vegetables with tongs.
- Continue cooking for about 4 to 6 minutes, until the noodles are tender and the liquid has mostly been
  absorbed. Add a small splash of drinking water if the noodles are still firm; serve while hot.
