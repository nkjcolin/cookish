steps:
- Put the rice, water, ginger, garlic if using, and soy sauce if using in a heavy saucepan with a close-fitting
  lid. Stir once and distribute the chicken and bok choy stems evenly over the rice.
- Bring to a full simmer, cover and lower the heat. Simmer for about 20 to 25 minutes, checking that the
  rice is becoming tender; if the pan dries before the rice is cooked, add a little more drinking water.
- Check the centre of several of the largest chicken pieces with a clean food thermometer. Continue covered
  cooking until they reach at least 75 C for 2 minutes; elapsed time alone does not establish doneness.
- Fold in the bok choy leaves, cover and cook for another 2 to 3 minutes until wilted. Turn off the heat,
  rest covered for 5 minutes, fluff gently, and finish with spring onion if using.
