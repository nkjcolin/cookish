steps:
- Rinse and drain the rice. Put it in a large saucepan with the ginger and the cooking water, using a
  little more than a litre of water per 100 g dry rice as a starting point, then bring to a boil.
- Reduce to a gentle simmer with the lid partly open. Cook for 35-40 minutes, stirring along the base
  regularly, until the grains are very soft and the mixture is porridge-like. Add water if it becomes
  too thick.
- While it simmers, prepare the chicken on a separate board. Wash hands and utensils, then prepare the
  spring onion if using.
- Stir the chicken strips into the simmering porridge so they separate. Cook for about 8-10 minutes, stirring
  often. Verify the thickest chicken reaches 75 C for 2 minutes.
- Add the salt and spring onion if using. Simmer for another minute, then serve promptly; this recipe
  starts from dry rice and needs no advance rice cooking.
