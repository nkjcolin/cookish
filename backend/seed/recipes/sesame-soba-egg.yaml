steps:
- Put the eggs in a saucepan, cover with water, and bring to a boil. Reduce to a gentle simmer for 10-12
  minutes, until the whites and yolks are fully firm. Cool under cold running water, peel, and quarter.
- While the eggs cook, wash and prepare the cucumber and carrot. Mix the sesame oil and soy sauce in a
  large serving bowl.
- In a separate saucepan, bring fresh water to a boil and cook the soba for the time on its packet, stirring
  gently to separate the strands.
- Drain the noodles and rinse under cold running water to remove surface starch, then drain well.
- Toss the noodles and vegetables in the dressing, divide between bowls, and top with the egg. Serve immediately
  or refrigerate promptly if keeping for later.
