title: Tomato and red lentil dhal
variant_of: null
cuisine: indian
total_minutes: 40
active_minutes: 15
difficulty: 1
servings: 2
equipment: [stove]
taste_tags: [soupy]
ingredients:
  - {canonical_name: red lentil, quantity: 160, unit: g, essential: true, prep_note: picked over}
  - {canonical_name: tomato, quantity: 200, unit: g, essential: true, prep_note: chopped}
  - {canonical_name: onion, quantity: 100, unit: g, essential: true, prep_note: finely chopped}
  - {canonical_name: garlic, quantity: 8, unit: g, essential: false, prep_note: finely chopped}
  - {canonical_name: turmeric powder, quantity: 2, unit: g, essential: true}
  - {canonical_name: cumin powder, quantity: 2, unit: g, essential: true}
  - {canonical_name: canola oil, quantity: 10, unit: ml, essential: true}
  - {canonical_name: salt, quantity: 1, unit: g, essential: false}
  - {canonical_name: water, quantity: 800, unit: ml, essential: true}
steps:
  - Heat the oil in a saucepan over medium-low heat. Add the onion and cook for 5 minutes until softened.
  - Add the garlic if using, turmeric, and cumin. Stir for 30 seconds, then add the tomato and cook for 2 minutes.
  - Add the lentils and water. Bring to a boil, reduce the heat, and simmer partly covered for 20 to 25 minutes, stirring occasionally, until the lentils are very soft.
  - Stir firmly to thicken the dhal and add the salt if using. Serve hot.
