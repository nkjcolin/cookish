steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Warm the oil in another saucepan and soften the onion. Stir in garlic if using, then turmeric and cumin
  briefly without burning them.
- Add the tomatoes and stir until they begin to break down. Add the lentils and enough water to cover
  them generously.
- Bring to a boil and simmer, stirring occasionally, until the lentils are fully soft. Add water as they
  absorb it to maintain a spoonable consistency; allow about 20 to 25 minutes.
- Add salt if using and serve the dhal with the freshly cooked rice.
