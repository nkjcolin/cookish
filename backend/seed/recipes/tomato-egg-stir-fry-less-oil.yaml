steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Warm the oil in a nonstick pan over medium-low heat. Gently stir the beaten eggs until set, then put
  them in a clean bowl.
- Add the tomatoes and a small splash of water to the same pan. Cover until softened, adding a little
  more water only if the pan dries out.
- Remove the lid briefly to thicken the tomato juices. Return the eggs, add the salt if using and heat
  until completely cooked.
- Spoon the topping over the cooked rice and finish with spring onion if using. Serve immediately.
