title: Tomato and egg stir-fry with less oil
variant_of: 645a8d38-bfae-47f2-b00e-3ca6828a964e
variant_label: less oil
cuisine: chinese
total_minutes: 20
active_minutes: 15
difficulty: 1
servings: 2
equipment: [stove]
taste_tags: [light, low_oil]
ingredients:
  - {canonical_name: tomato, quantity: 300, unit: g, essential: true, prep_note: cut into wedges}
  - {canonical_name: egg, quantity: 3, unit: pcs, essential: true, prep_note: beaten}
  - {canonical_name: canola oil, quantity: 5, unit: ml, essential: true}
  - {canonical_name: salt, quantity: 1, unit: g, essential: false}
  - {canonical_name: water, quantity: 60, unit: ml, essential: true}
  - {canonical_name: spring onion, quantity: 10, unit: g, essential: false, prep_note: thinly sliced}
steps:
  - Heat the oil in a nonstick frying pan over medium-low heat. Add the beaten eggs and gently stir until fully set, then transfer to a plate.
  - Add the tomato and water to the same pan. Cover and simmer for 5 to 7 minutes until the tomato softens.
  - Remove the lid and stir for 1 to 2 minutes to reduce excess liquid.
  - Return the eggs to the pan, add the salt if using, and fold together until everything is hot. Finish with the spring onion if using.
