steps:
- Rinse the rice and cook in a covered saucepan using its packet's water amount and cooking time. Rest
  covered off the heat when cooked.
- Prepare the onion, garlic and tomato. Keep the raw prawns and their utensils separate from the cooked
  rice and vegetables.
- Heat the oil in a frying pan over medium heat. Cook the onion for 4 minutes, then add the garlic and
  chilli paste and stir for a minute.
- Add the tomato, salt and a splash of water. Simmer for 6-8 minutes until the tomato forms a sauce, stirring
  occasionally.
- Add the prawns and turn them in the sauce for about 5-7 minutes. Verify the thickest prawns reach 75
  C for 2 minutes; extend cooking as needed. Fluff the rice and serve immediately.
