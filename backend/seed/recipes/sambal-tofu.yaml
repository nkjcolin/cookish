steps:
- Rinse the rice and cook in a covered saucepan using the water amount and time on its packet. Rest covered
  off the heat when cooked.
- Meanwhile, drain and cube the tofu and prepare the vegetables. Warm half the oil in a non-stick frying
  pan over medium heat and cook the tofu for 6-8 minutes, turning gently. Transfer to a clean plate.
- Add the remaining oil and the onion to the same pan. Stir for 4 minutes, then add the garlic and chilli
  paste and stir for 1 minute.
- Add the tomato, salt and a splash of water. Simmer for 6-8 minutes, stirring occasionally, until the
  tomato breaks down into a sauce.
- Return the tofu and gently coat it in the sauce. Simmer for 3-4 minutes until hot throughout, adding
  a little more water if needed. Fluff the rice and serve with the tofu immediately.
