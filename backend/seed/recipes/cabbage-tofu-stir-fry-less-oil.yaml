equipment: [stove]
taste_tags: [light, low_oil, vegetable_rich]
ingredients:
  - {canonical_name: cabbage, quantity: 300, unit: g, essential: true, prep_note: thinly sliced}
  - {canonical_name: firm tofu, quantity: 300, unit: g, essential: true, prep_note: drained and cut into cubes}
  - {canonical_name: garlic, quantity: 8, unit: g, essential: false, prep_note: finely chopped}
  - {canonical_name: canola oil, quantity: 5, unit: ml, essential: true}
  - {canonical_name: soy sauce, quantity: 10, unit: ml, essential: false}
  - {canonical_name: water, quantity: 80, unit: ml, essential: true}
steps:
  - Heat the oil in a nonstick frying pan over medium-low heat. Add the garlic if using and stir for 30 seconds.
  - Add the cabbage and water. Cover and simmer for 3 minutes.
  - Add the tofu and gently fold it through the cabbage. Cover and cook for 5 to 7 minutes until the cabbage is tender and the tofu is hot throughout.
  - Uncover, add the soy sauce if using, and stir gently for 1 to 2 minutes to reduce excess liquid.
