steps:
- Start the uncooked rice in a covered saucepan using water and cooking time from the rice packet. Prepare
  the topping while it cooks; keep the finished rice hot and serve both components together.
- Warm the oil in a nonstick pan and briefly stir the garlic if using. Add the cabbage and a splash of
  water.
- Cover until the cabbage starts to soften. Add the tofu and turn gently, adding a little more water only
  if necessary.
- Cover until the tofu is hot throughout and the cabbage is tender. Add soy sauce if using, then uncover
  briefly to reduce excess liquid.
- Serve the topping over the cooked rice immediately.
