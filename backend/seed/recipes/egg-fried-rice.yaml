steps:
- Use already cooked rice that has been handled safely; the time here excludes cooking rice from dry.
  Do not use rice with uncertain storage history.
- Heat one third of the oil in a large nonstick pan. Stir the beaten eggs until set and transfer them
  to a clean bowl.
- Add the remaining oil. Stir-fry the garlic, carrot and peas if using until the vegetables are tender.
- Add the rice, break up clumps and stir until hot throughout. Fold in the eggs and soy sauce if using.
  For refrigerated rice, ensure the whole mixture reaches at least 75 C for 2 minutes; reheat only once.
- Add spring onion if using and serve immediately. Heating cannot make poorly stored rice safe.
