AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cookish AWS infrastructure

Parameters:
  FrontendOrigin:
    Type: String
    Default: https://main.d146krzza1ana.amplifyapp.com
    Description: Allowed frontend origin for CORS
  SoclaasApiKeySecretArn:
    Type: String
    Default: arn:aws:secretsmanager:ap-southeast-1:534444203105:secret:cookish/soclaas-api-key-oyPgRQ

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512

Resources:

  # ---------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------

  CookishUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cookish-users

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Schema:
        - Name: email
          Required: true
          Mutable: true

  CookishUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cookish-web
      UserPoolId: !Ref CookishUserPool

      # Browser applications must not have a client secret
      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------
  # VPC
  # ---------------------------------------------------------

  CookishVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: cookish-vpc
        - Key: project
          Value: cookish

  CookishPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CookishVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cookish-private-a
        - Key: project
          Value: cookish

  CookishPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CookishVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cookish-private-b
        - Key: project
          Value: cookish

  # ---------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------

  CookishLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Cookish API Lambda
      VpcId: !Ref CookishVpc
      Tags:
        - Key: Name
          Value: cookish-lambda-sg
        - Key: project
          Value: cookish

  CookishDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from Cookish Lambda only
      VpcId: !Ref CookishVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref CookishLambdaSecurityGroup
      Tags:
        - Key: Name
          Value: cookish-db-sg
        - Key: project
          Value: cookish

  CookishSecretsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Lambda access to Secrets Manager endpoint
      VpcId: !Ref CookishVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref CookishLambdaSecurityGroup
      Tags:
        - Key: Name
          Value: cookish-secrets-endpoint-sg
        - Key: project
          Value: cookish

  # ---------------------------------------------------------
  # Secrets Manager VPC Endpoint
  # ---------------------------------------------------------

  CookishSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CookishVpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref CookishPrivateSubnetA
        - !Ref CookishPrivateSubnetB
      SecurityGroupIds:
        - !Ref CookishSecretsEndpointSecurityGroup

  # ---------------------------------------------------------
  # Database Secret
  # ---------------------------------------------------------

  CookishDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Cookish PostgreSQL credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cookish_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: project
          Value: cookish

  # ---------------------------------------------------------
  # RDS Subnet Group
  # ---------------------------------------------------------

  CookishDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Cookish private database subnets
      SubnetIds:
        - !Ref CookishPrivateSubnetA
        - !Ref CookishPrivateSubnetB
      Tags:
        - Key: project
          Value: cookish

  # ---------------------------------------------------------
  # RDS PostgreSQL
  # ---------------------------------------------------------

  CookishDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: cookish-db
      DBName: cookish

      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: db.t4g.micro

      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true

      Port: 5432

      MultiAZ: false
      PubliclyAccessible: false

      DBSubnetGroupName: !Ref CookishDbSubnetGroup
      VPCSecurityGroups:
        - !Ref CookishDbSecurityGroup

      MasterUsername: !Sub "{{resolve:secretsmanager:${CookishDbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${CookishDbSecret}:SecretString:password}}"

      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      DeletionProtection: false

      Tags:
        - Key: project
          Value: cookish

  CookishDbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref CookishDbSecret
      TargetId: !Ref CookishDb
      TargetType: AWS::RDS::DBInstance

  # ---------------------------------------------------------
  # API Gateway HTTP API
  # ---------------------------------------------------------

  CookishHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin

        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key

        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CookishJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub
                - "https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}"
                - PoolId: !Ref CookishUserPool
              audience:
                - !Ref CookishUserPoolClient


  # ---------------------------------------------------------
  # Main API Lambda
  # ---------------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cookish-api
      CodeUri: ../backend/
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 15
      VpcConfig:
        SecurityGroupIds:
          - !Ref CookishLambdaSecurityGroup
        SubnetIds:
          - !Ref CookishPrivateSubnetA
          - !Ref CookishPrivateSubnetB

      Environment:
        Variables:
          DB_SECRET_ARN: !Ref CookishDbSecret

      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref CookishDbSecret
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /api/{proxy+}
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /api/{proxy+}
            Method: POST
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        ApiPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /api/{proxy+}
            Method: PUT
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        ApiPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /api/{proxy+}
            Method: PATCH
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /api/{proxy+}
            Method: DELETE
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer
  # ---------------------------------------------------------
  # Database Migration Lambda
  # ---------------------------------------------------------

  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cookish-migrate
      CodeUri: ../backend/
      Handler: app.migrate.handler
      Runtime: python3.12

      Architectures:
        - arm64

      MemorySize: 512
      Timeout: 120

      VpcConfig:
        SecurityGroupIds:
          - !Ref CookishLambdaSecurityGroup
        SubnetIds:
          - !Ref CookishPrivateSubnetA
          - !Ref CookishPrivateSubnetB

      Environment:
        Variables:
          DB_SECRET_ARN: !Ref CookishDbSecret

      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref CookishDbSecret

  # ---------------------------------------------------------
  # AI Lambda
  # ---------------------------------------------------------

  # Image jobs are isolated from CookishDb. The worker never connects to PostgreSQL.
  AiJobImages:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireImageUploads
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  AiJobImagesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AiJobImages
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AiJobImages.Arn
              - !Sub "${AiJobImages.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AiJobs:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AiImageDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  AiImageQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 720 # six times the worker Lambda's 120-second timeout
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiImageDeadLetterQueue.Arn
        maxReceiveCount: 5

  AiImageWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cookish-ai-worker
      CodeUri: ../ai/
      Handler: app.job_worker.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          AI_JOB_BACKEND: aws
          AI_JOB_BUCKET: !Ref AiJobImages
          AI_JOB_TABLE: !Ref AiJobs
          AI_JOB_QUEUE_URL: !Ref AiImageQueue
          AI_WORKER_TIMEOUT_SECONDS: "110"
          AI_PROVIDER: soclaas
          SOCLAAS_BASE_URL: https://soclaas-api.comp.nus.edu.sg/v1
          SOCLAAS_MODEL: qwen3-vl:32b
          SOCLAAS_IMAGE_MODEL: qwen3-vl:32b
          SOCLAAS_OUTPUT_MODE: json_schema
          SOCLAAS_MAX_OUTPUT_TOKENS: "4096"
          SOCLAAS_PRICING_CACHE_SECONDS: "3600"
          SOCLAAS_TIMEOUT_SECONDS: "90"
          SOCLAAS_API_KEY_SECRET_ARN: !Ref SoclaasApiKeySecretArn
          SOCLAAS_PHOTO_QUANTITY_MODE: instances
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SoclaasApiKeySecretArn
        - S3ReadPolicy:
            BucketName: !Ref AiJobImages
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt AiJobs.Arn
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "${AiJobImages.Arn}/images/*"
            - Effect: Allow
              Action: sqs:ChangeMessageVisibility
              Resource: !GetAtt AiImageQueue.Arn
      Events:
        ImageJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt AiImageQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2

  AiImageWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AiImageWorker}"
      RetentionInDays: 14

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cookish-ai
      CodeUri: ../ai/
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 120

      Environment:
        Variables:
          AI_PROVIDER: soclaas
          SOCLAAS_BASE_URL: https://soclaas-api.comp.nus.edu.sg/v1
          SOCLAAS_MODEL: qwen3-vl:32b
          SOCLAAS_IMAGE_MODEL: qwen3-vl:32b
          SOCLAAS_AUDIO_MODEL: whisper-large-v3
          SOCLAAS_OUTPUT_MODE: json_schema
          SOCLAAS_MAX_OUTPUT_TOKENS: "4096"
          SOCLAAS_PRICING_CACHE_SECONDS: "3600"
          AI_REQUEST_TIMEOUT_SECONDS: "27"
          AI_JOB_BACKEND: aws
          AI_JOB_BUCKET: !Ref AiJobImages
          AI_JOB_TABLE: !Ref AiJobs
          AI_JOB_QUEUE_URL: !Ref AiImageQueue
          SOCLAAS_TIMEOUT_SECONDS: "60"
          SOCLAAS_API_KEY_SECRET_ARN: !Ref SoclaasApiKeySecretArn
          SOCLAAS_PHOTO_QUANTITY_MODE: instances

      Policies:
        - S3WritePolicy:
            BucketName: !Ref AiJobImages
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AiImageQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AiJobs.Arn
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "${AiJobImages.Arn}/images/*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SoclaasApiKeySecretArn

      Events:
        AiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /ai/{proxy+}
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        AiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /ai/{proxy+}
            Method: POST
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        AiPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /ai/{proxy+}
            Method: PUT
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        AiPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /ai/{proxy+}
            Method: PATCH
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

        AiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CookishHttpApi
            Path: /ai/{proxy+}
            Method: DELETE
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: CookishJwtAuthorizer

# -----------------------------------------------------------
# Useful values for Role 1
# -----------------------------------------------------------

Outputs:

  ApiUrl:
    Description: Cookish HTTP API URL
    Value: !Sub "https://${CookishHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CookishUserPool

  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CookishUserPoolClient

  VpcId:
    Description: Cookish VPC ID
    Value: !Ref CookishVpc

  DbEndpoint:
    Description: Cookish PostgreSQL endpoint
    Value: !GetAtt CookishDb.Endpoint.Address

  DbSecretArn:
    Description: ARN of Cookish database secret
    Value: !Ref CookishDbSecret